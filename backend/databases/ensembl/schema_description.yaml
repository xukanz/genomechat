schema:
  # Ensembl human core database, queried live over the public read-only MySQL
  # mirror at ensembldb.ensembl.org. Only the tables listed here are exposed to
  # the SQL agent; the full core schema has roughly 75 tables and flooding the
  # model context with all of them degrades query quality.
  #
  # This is a shared public server on the far side of the internet. Always
  # bound results with LIMIT and filter on indexed columns rather than scanning
  # gene/transcript/exon in full.
  dialect_notes: >
    MySQL syntax. Quote identifiers with backticks. Use LIMIT n. Coordinates
    are 1-based inclusive and seq_region_strand is 1 or -1, not +/-.
  tables:
    gene:
      description: >
        One row per annotated gene. Genomic position is stored against a
        numeric seq_region_id, so a join to seq_region is required to get a
        chromosome name.
      columns:
        - name: gene_id
          type: integer
          description: >
            Internal primary key. Changes between Ensembl releases — join on
            it, but report stable_id.
          constraints: primary key
        - name: stable_id
          type: varchar
          description: >
            Public stable identifier, e.g. ENSG00000141510. Stored without the
            ".N" version suffix that users often paste; strip the suffix before
            matching.
        - name: biotype
          type: varchar
          description: >
            e.g. protein_coding, lncRNA, processed_pseudogene, miRNA. Indexed
            and cheap to group by.
        - name: seq_region_id
          type: integer
          description: Foreign key to seq_region. Not a chromosome name.
        - name: seq_region_start
          type: integer
          description: Start coordinate, 1-based inclusive.
        - name: seq_region_end
          type: integer
          description: End coordinate, 1-based inclusive.
        - name: seq_region_strand
          type: integer
          description: 1 for the forward strand, -1 for reverse.
        - name: description
          type: text
          description: Free-text gene description with its source in brackets.
        - name: canonical_transcript_id
          type: integer
          description: Foreign key to transcript — the representative transcript.
        - name: source
          type: varchar
          description: Annotation source, e.g. ensembl_havana.

    transcript:
      description: One row per transcript. Joins to gene via gene_id.
      columns:
        - name: transcript_id
          type: integer
          constraints: primary key
        - name: gene_id
          type: integer
          description: Foreign key to gene.
        - name: stable_id
          type: varchar
          description: Public identifier, e.g. ENST00000380152.
        - name: biotype
          type: varchar
          description: >
            Transcript biotype; differs from the parent gene's, e.g.
            retained_intron on a protein_coding gene.
        - name: seq_region_id
          type: integer
        - name: seq_region_start
          type: integer
        - name: seq_region_end
          type: integer
        - name: seq_region_strand
          type: integer

    translation:
      description: Protein products of coding transcripts.
      columns:
        - name: translation_id
          type: integer
          constraints: primary key
        - name: transcript_id
          type: integer
          description: Foreign key to transcript.
        - name: stable_id
          type: varchar
          description: Public identifier, e.g. ENSP00000269305.
        - name: seq_start
          type: integer
          description: Offset of the coding start within the first exon.
        - name: seq_end
          type: integer
          description: Offset of the coding end within the last exon.

    exon:
      description: >
        Exon coordinates. Multi-million rows — never scan without a WHERE
        clause. Exons are shared across transcripts, so the link to a
        transcript lives in exon_transcript.
      columns:
        - name: exon_id
          type: integer
          constraints: primary key
        - name: seq_region_id
          type: integer
        - name: seq_region_start
          type: integer
        - name: seq_region_end
          type: integer
        - name: seq_region_strand
          type: integer
        - name: phase
          type: integer
          description: Reading-frame phase at the exon start; -1 for non-coding.
        - name: end_phase
          type: integer
          description: Reading-frame phase at the exon end.

    exon_transcript:
      description: >
        Link table joining exons to transcripts. Required for any per-transcript
        exon structure query.
      columns:
        - name: exon_id
          type: integer
        - name: transcript_id
          type: integer
        - name: rank
          type: integer
          description: Exon order within the transcript, starting at 1.

    seq_region:
      description: >
        Chromosomes, scaffolds, and patches. Join here to turn a
        seq_region_id into a chromosome name.
      columns:
        - name: seq_region_id
          type: integer
          constraints: primary key
        - name: name
          type: varchar
          description: >
            e.g. "1", "X", "MT". Also holds alt scaffolds and patches, so
            restrict to coord_system.name = 'chromosome' plus a name pattern
            to stay on the primary assembly.
        - name: coord_system_id
          type: integer
          description: Foreign key to coord_system.
        - name: length
          type: integer
          description: Length of the region in base pairs.

    coord_system:
      description: Assembly coordinate systems.
      columns:
        - name: coord_system_id
          type: integer
          constraints: primary key
        - name: name
          type: varchar
          description: e.g. chromosome, scaffold, contig.
        - name: version
          type: varchar
          description: Assembly version, e.g. GRCh38.
        - name: rank
          type: integer

    xref:
      description: >
        External identifiers. Part of a three-table pattern — an xref is tied
        to an Ensembl object through object_xref, and its source is named in
        external_db.
      columns:
        - name: xref_id
          type: integer
          constraints: primary key
        - name: external_db_id
          type: integer
          description: Foreign key to external_db.
        - name: dbprimary_acc
          type: varchar
          description: Accession in the external database.
        - name: display_label
          type: varchar
          description: >
            Human-readable label. For HGNC xrefs this is the gene symbol, which
            makes it the usual entry point for symbol lookups.
        - name: description
          type: text

    object_xref:
      description: Links an xref to a gene, transcript, or translation.
      columns:
        - name: object_xref_id
          type: integer
          constraints: primary key
        - name: xref_id
          type: integer
        - name: ensembl_id
          type: integer
          description: >
            The internal id of the target object. Which table it refers to is
            given by ensembl_object_type.
        - name: ensembl_object_type
          type: varchar
          description: One of Gene, Transcript, Translation.

    external_db:
      description: Names the source of an xref.
      columns:
        - name: external_db_id
          type: integer
          constraints: primary key
        - name: db_name
          type: varchar
          description: >
            e.g. HGNC, EntrezGene, RefSeq_mRNA, Uniprot/SWISSPROT. Filter on
            this to pick the identifier system you want.

    external_synonym:
      description: Alternative names for an xref, such as former gene symbols.
      columns:
        - name: xref_id
          type: integer
        - name: synonym
          type: varchar

    karyotype:
      description: Cytogenetic bands. Small table, safe to scan.
      columns:
        - name: karyotype_id
          type: integer
          constraints: primary key
        - name: seq_region_id
          type: integer
        - name: seq_region_start
          type: integer
        - name: seq_region_end
          type: integer
        - name: band
          type: varchar
          description: Band name, e.g. q24.3.
        - name: stain
          type: varchar
          description: Giemsa stain class, e.g. gpos50, gneg, acen.

    analysis:
      description: Provenance of each annotation feature — which pipeline produced it.
      columns:
        - name: analysis_id
          type: integer
          constraints: primary key
        - name: logic_name
          type: varchar

    assembly:
      description: Maps assembled sequence to its component pieces. Rarely needed directly.
      columns:
        - name: asm_seq_region_id
          type: integer
        - name: cmp_seq_region_id
          type: integer

    meta:
      description: >
        Key-value metadata about the database itself. Tiny and cheap to query;
        "SELECT * FROM meta WHERE meta_key LIKE 'assembly%'" confirms the
        assembly version.
      columns:
        - name: meta_id
          type: integer
          constraints: primary key
        - name: meta_key
          type: varchar
        - name: meta_value
          type: varchar
