<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GenomeChat">
  <title>GenomeChat</title>

  <!--
    Favicon / avatar variant of logo.svg.

    Deliberately NOT the same artwork scaled down. At 16px the speech-bubble
    tail and four helix turns collapse into noise, so this version drops the
    tail for a plain disc and halves the helix to two crossings with heavier
    strokes. Same palette, same motif, legible as a 16px browser tab.

    Strand geometry mirrors logo.svg: control points on the centre line
    (x=32), so the strands are widest at the segment endpoints (y = 16, 32,
    48) and cross at the midpoints (y ~ 24, 40). The single rung sits at
    y=32, the interior widest point.
  -->

  <defs>
    <linearGradient id="gcc-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a7ae6"/>
      <stop offset="1" stop-color="#0055ad"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#gcc-disc)"/>

  <g fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round">
    <path d="M20 16 Q32 24 44 32 Q32 40 20 48"/>
    <path d="M44 16 Q32 24 20 32 Q32 40 44 48"/>
  </g>

  <line x1="21.5" y1="32" x2="42.5" y2="32"
        stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
</svg>
