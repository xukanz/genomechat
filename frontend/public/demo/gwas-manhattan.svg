<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#ffffff" />
  <text x="24" y="32" font-size="16" font-weight="700" fill="#0f172a">Type 2 Diabetes &#8212; Genome-wide Significant Loci</text>
  <text x="24" y="52" font-size="11" fill="#64748b">GWAS Catalog &#8226; -log10(p) by chromosome &#8226; simulated demo data</text>

  <line x1="60" y1="300" x2="610" y2="300" stroke="#cbd5e1" stroke-width="1" />
  <line x1="60" y1="70" x2="60" y2="300" stroke="#cbd5e1" stroke-width="1" />
  <line x1="60" y1="140" x2="610" y2="140" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4 4" />
  <text x="614" y="144" font-size="9" fill="#ef4444">p = 5e-8</text>

  <g font-size="10" fill="#94a3b8" text-anchor="end">
    <text x="52" y="304">0</text>
    <text x="52" y="234">5</text>
    <text x="52" y="144">7.3</text>
    <text x="52" y="74">15</text>
  </g>

  <!-- alternating chromosome bands with scattered points, two peaks called out -->
  <g>
    <rect x="60" y="70" width="46" height="230" fill="#f8fafc" />
    <rect x="152" y="70" width="46" height="230" fill="#f8fafc" />
    <rect x="244" y="70" width="46" height="230" fill="#f8fafc" />
    <rect x="336" y="70" width="46" height="230" fill="#f8fafc" />
    <rect x="428" y="70" width="46" height="230" fill="#f8fafc" />
    <rect x="520" y="70" width="46" height="230" fill="#f8fafc" />
  </g>

  <g fill="#93C5FD">
    <circle cx="70" cy="280" r="3" /><circle cx="80" cy="270" r="3" /><circle cx="92" cy="260" r="3" />
    <circle cx="118" cy="285" r="3" /><circle cx="130" cy="255" r="3" /><circle cx="142" cy="272" r="3" />
    <circle cx="164" cy="240" r="3" /><circle cx="176" cy="220" r="3" /><circle cx="188" cy="265" r="3" />
    <circle cx="210" cy="280" r="3" /><circle cx="222" cy="268" r="3" />
    <circle cx="256" cy="250" r="3" /><circle cx="268" cy="230" r="3" /><circle cx="280" cy="270" r="3" />
    <circle cx="302" cy="278" r="3" /><circle cx="314" cy="260" r="3" /><circle cx="326" cy="245" r="3" />
    <circle cx="348" cy="255" r="3" /><circle cx="360" cy="275" r="3" /><circle cx="372" cy="235" r="3" />
    <circle cx="394" cy="280" r="3" /><circle cx="406" cy="265" r="3" /><circle cx="418" cy="250" r="3" />
    <circle cx="440" cy="270" r="3" /><circle cx="452" cy="258" r="3" /><circle cx="464" cy="240" r="3" />
    <circle cx="486" cy="275" r="3" /><circle cx="498" cy="262" r="3" /><circle cx="510" cy="248" r="3" />
    <circle cx="532" cy="270" r="3" /><circle cx="544" cy="256" r="3" /><circle cx="556" cy="266" r="3" />
  </g>

  <!-- two called-out genome-wide significant peaks -->
  <g fill="#0066CC">
    <circle cx="176" cy="102" r="4" />
    <circle cx="180" cy="118" r="4" />
    <circle cx="172" cy="128" r="4" />
    <circle cx="452" cy="92" r="4" />
    <circle cx="456" cy="110" r="4" />
    <circle cx="448" cy="124" r="4" />
  </g>
  <text x="176" y="92" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">TCF7L2</text>
  <text x="452" y="82" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">KCNQ1</text>

  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="83" y="314">chr3</text><text x="175" y="314">chr6</text><text x="267" y="314">chr9</text>
    <text x="359" y="314">chr10</text><text x="451" y="314">chr11</text><text x="543" y="314">chr16</text>
  </g>

  <text x="24" y="360" font-size="10" fill="#94a3b8">Generated by Coder agent &#8226; GenomeChat demo mode</text>
