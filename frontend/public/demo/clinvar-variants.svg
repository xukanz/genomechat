<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#ffffff" />
  <text x="24" y="32" font-size="16" font-weight="700" fill="#0f172a">BRCA1 Pathogenic Variants by Type</text>
  <text x="24" y="52" font-size="11" fill="#64748b">ClinVar &#8226; Pathogenic + Likely pathogenic &#8226; simulated demo data</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="600" y2="300" stroke="#cbd5e1" stroke-width="1" />
  <line x1="70" y1="80" x2="70" y2="300" stroke="#cbd5e1" stroke-width="1" />

  <!-- gridlines -->
  <g stroke="#eef2f7" stroke-width="1">
    <line x1="70" y1="240" x2="600" y2="240" />
    <line x1="70" y1="180" x2="600" y2="180" />
    <line x1="70" y1="120" x2="600" y2="120" />
  </g>
  <g font-size="10" fill="#94a3b8" text-anchor="end">
    <text x="62" y="304">0</text>
    <text x="62" y="244">20</text>
    <text x="62" y="184">40</text>
    <text x="62" y="124">60</text>
    <text x="62" y="84">80</text>
  </g>

  <!-- bars: missense 74, frameshift 52, nonsense 38, splice-site 23 -->
  <g>
    <rect x="110" y="78" width="80" height="222" rx="6" fill="#0066CC" />
    <text x="150" y="68" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">74</text>
    <text x="150" y="318" font-size="11" fill="#475569" text-anchor="middle">Missense</text>

    <rect x="230" y="144" width="80" height="156" rx="6" fill="#3B82F6" />
    <text x="270" y="134" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">52</text>
    <text x="270" y="318" font-size="11" fill="#475569" text-anchor="middle">Frameshift</text>

    <rect x="350" y="186" width="80" height="114" rx="6" fill="#60A5FA" />
    <text x="390" y="176" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">38</text>
    <text x="390" y="318" font-size="11" fill="#475569" text-anchor="middle">Nonsense</text>

    <rect x="470" y="231" width="80" height="69" rx="6" fill="#93C5FD" />
    <text x="510" y="221" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">23</text>
    <text x="510" y="318" font-size="11" fill="#475569" text-anchor="middle">Splice-site</text>
  </g>

  <text x="24" y="360" font-size="10" fill="#94a3b8">Generated by Coder agent &#8226; GenomeChat demo mode</text>
