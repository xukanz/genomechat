# docker-compose.prod.yml - Production Deployment
# GenomeChat Platform - Backend + Frontend + Sandbox
# Run from docker/ directory: docker-compose -f docker-compose.prod.yml up -d
version: '3.8'

services:
  sandbox:
    image: genomechat-sandbox:v1
    build:
      context: ../sandbox
      dockerfile: Dockerfile
    container_name: genomechat-sandbox-prod
    ports:
      - "8080:8080"
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /sandbox:rw,noexec,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    env_file:
      - ../.env.prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  backend:
    image: genomechat-api:v1
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: genomechat-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - ../.env.prod
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      # PORTKEY_* and the rest of the runtime config come from .env.prod via
      # env_file — no override here so prod secrets never leak into repo config.
    # Use gunicorn with multiple workers in production
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --access-logfile - --error-logfile -
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      sandbox:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  frontend:
    image: genomechat-ui:v1
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: genomechat-frontend-prod
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  app-network:
    driver: bridge
