# docker-compose.yml - Local Development Environment
# GenomeChat Platform - Backend + Frontend + Sandbox
# Run from docker/ directory: docker-compose up -d

services:
  sandbox:
    build:
      context: ../sandbox
      dockerfile: Dockerfile
    container_name: genomechat-sandbox-dev
    ports:
      - "8080:8080"
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /sandbox:rw,noexec,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    env_file:
      - ../sandbox/.env
    environment:
      - SANDBOX_SINGLE_WORKER=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  r-sandbox:
    build:
      context: ../r-sandbox
      dockerfile: Dockerfile
    container_name: genomechat-r-sandbox-dev
    ports:
      - "8081:8081"
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /sandbox:rw,noexec,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    env_file:
      - ../r-sandbox/.env
    environment:
      - SANDBOX_SINGLE_WORKER=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: genomechat-backend-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload (writable for UV virtual environment)
      - ../backend:/app
      # Mount a CA bundle so Python's httpx/requests can validate TLS to the
      # LLM gateway through an intercepting proxy. Read-only at a stable path;
      # SSL_CERT_PATH below points into it.
      - ../.certs:/certs:ro
    env_file:
      - ../backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - SANDBOX_URL=${SANDBOX_URL:-http://sandbox:8080}
      - R_SANDBOX_URL=${R_SANDBOX_URL:-http://r-sandbox:8081}
      # OpenAI-compatible gateway, used by the agents and the memory pipeline.
      # The backend also still accepts the older OPENAI_BEDROCK_* / PORTKEY_*
      # spellings of these.
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Which header also carries the key ('' = standard bearer only).
      - OPENAI_API_KEY_HEADER=${OPENAI_API_KEY_HEADER:-x-portkey-api-key}
      # OPENAI_EXTRA_HEADERS is deliberately NOT listed here. It is JSON, so an
      # inline ${VAR:-...} default would have to nest braces, and listing it
      # bare would override the env_file with an empty string whenever the host
      # doesn't set it. Put it in backend/.env instead (loaded via env_file):
      #   OPENAI_EXTRA_HEADERS={"x-portkey-slug":"bedrock"}
      # Per-agent models — defaults live in src/config/settings.py
      - OPENAI_MODEL_COORDINATOR=${OPENAI_MODEL_COORDINATOR:-us.anthropic.claude-sonnet-4-6}
      - OPENAI_MODEL_ORCHESTRATOR=${OPENAI_MODEL_ORCHESTRATOR:-us.anthropic.claude-opus-5}
      - OPENAI_MODEL_CODER=${OPENAI_MODEL_CODER:-us.anthropic.claude-sonnet-5}
      - OPENAI_MODEL_SQL_AGENT=${OPENAI_MODEL_SQL_AGENT:-us.anthropic.claude-sonnet-5}
      - OPENAI_MODEL_RESEARCHER=${OPENAI_MODEL_RESEARCHER:-us.anthropic.claude-sonnet-5}
      - OPENAI_MODEL_SUMMARIZER=${OPENAI_MODEL_SUMMARIZER:-us.anthropic.claude-sonnet-4-6}
      # CA bundle for Python httpx/requests, inside the /certs volume above.
      - SSL_CERT_PATH=${SSL_CERT_PATH_CONTAINER:-/certs/ca-bundle.crt}
      # MongoDB Configuration
      - MONGODB_CONNECTION_STRING=${MONGODB_CONNECTION_STRING}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-genome_chat}
      - CHECKPOINTER_TYPE=${CHECKPOINTER_TYPE:-mongodb}
      # SSL_CERT_PATH is set above and points into the /certs volume. It is
      # deliberately not `${SSL_CERT_PATH}` — that name is set in backend/.env as
      # a host-relative path and is not exported into the shell running
      # `docker compose up`, so the substitution would resolve to empty.
      - DISABLE_SSL_VERIFY=${DISABLE_SSL_VERIFY:-true}
      # AWS S3 Configuration - loaded from env_file (./backend/.env)
      # Do not override here to allow env_file values to be used
      # SQL Agent Configuration
      - SQL_AGENT_MODE=${SQL_AGENT_MODE:-agentic}
      - SQL_HITL_ENABLED=${SQL_HITL_ENABLED:-true}
      - SQL_ALWAYS_SAVE_TO_S3=${SQL_ALWAYS_SAVE_TO_S3:-true}
      # Database Configuration — paths come from the profile registry
      # (DB_REGISTRY_*), not from these legacy variables.
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: genomechat-frontend-dev
    ports:
      - "3100:80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

networks:
  app-network:
    driver: bridge
